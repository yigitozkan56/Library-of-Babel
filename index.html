<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonsuz Harf Matrisi</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="theme-dark">
    <!-- Minimal Floating Control Bar -->
    <div class="control-bar">
      <!-- Search Form -->
      <form id="search-form" class="search-form">
        <button type="submit" class="icon-btn" aria-label="Arama Yap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <input
          id="search-input"
          type="text"
          inputmode="text"
          pattern="[A-Za-zĞÜŞİÖÇğüşiöçÁÉÍÓÚáéíóúÄÖÜäöüßÑñ]*"
          placeholder="KELİME..."
          class="search-input"
          autocomplete="off"
        />

        <button id="clear-btn" type="button" class="icon-btn" style="display: none;" aria-label="Temizle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </form>

      <!-- Meaningful Words Button & Area Scanner -->
      <div class="divider"></div>
      <button id="words-toggle-btn" type="button" class="text-btn" aria-label="Anlamlı Kelimeler">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>KELİMELER</span>
      </button>

      <!-- Auto Word Highlight Toggle & Nearby Count -->
      <div class="divider"></div>
      <button id="highlight-toggle-btn" type="button" class="text-btn active-highlight" title="10.000px Alanındaki Anlamlı Kelimeleri İşaretle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>İŞARETLER: <span id="nearby-word-count">N</span></span>
      </button>

      <!-- Match Navigation (Hidden when no matches) -->
      <div id="nav-section" class="nav-section" style="display: none;">
        <div class="divider"></div>
        <span id="match-counter" class="match-counter">N / N</span>
        <button id="prev-match-btn" type="button" class="icon-btn" aria-label="Önceki eşleşme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </button>
        <button id="next-match-btn" type="button" class="icon-btn" aria-label="Sonraki eşleşme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <!-- Center Coordinates (Roman Numerals) -->
      <div class="divider"></div>
      <div class="coord-badge" title="Roman Rakamları ile Koordinat (Sütun : Satır)">
        <span id="coord-col">N</span>
        <span>:</span>
        <span id="coord-row">N</span>
      </div>

      <!-- Reset Position -->
      <div class="divider"></div>
      <button id="reset-pos-btn" type="button" class="icon-btn" aria-label="Konumu Sıfırla">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
      </button>

      <!-- Theme Toggle -->
      <button id="theme-toggle-btn" type="button" class="icon-btn" aria-label="Tema Değiştir">
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Language Toggle -->
      <div class="divider"></div>
      <button id="lang-toggle-btn" type="button" class="text-btn" aria-label="Dil Değiştir / Change Language" title="Dil Değiştir / Change Language">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="lang-label">TR</span>
      </button>
    </div>

    <!-- Meaningful Words Drawer Panel -->
    <div id="word-panel" class="word-panel" style="display: none;">
      <div class="word-panel-header">
        <div class="word-panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span>ANLAMLIKELİMELER</span>
        </div>
        <button id="close-word-panel-btn" type="button" class="icon-btn" aria-label="Kapat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="word-panel-actions">
        <button id="random-word-btn" type="button" class="action-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
          </svg>
          <span>RASTGELE KELİME KEŞFET</span>
        </button>
      </div>

      <div class="word-category-tags" id="word-category-tags">
        <!-- Filter tags populated by JS -->
      </div>

      <div class="word-list" id="word-list">
        <!-- List populated by JS -->
      </div>
    </div>

    <!-- HTML5 Canvas -->
    <canvas id="canvas"></canvas>

    <script src="script.js"></script>
  </body>
</html>
